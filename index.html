<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roy & Trivena Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  color:#fff;
}
section{
  height:100vh;
  width:100%;
  position:absolute;
  top:0;left:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  transition:transform .8s ease;
}
.bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(6px) brightness(.6);
  z-index:-1;
}
.gold{color:#d4af37}
h1,h2{font-family:'Playfair Display',serif}

button{
  padding:14px 28px;
  border:none;
  background:#d4af37;
  color:#000;
  font-weight:600;
  border-radius:30px;
  cursor:pointer;
  margin-top:20px;
}

.slide{transform:translateY(100%)}
.slide.active{transform:translateY(0)}

.nav{
  position:fixed;
  right:15px;
  top:50%;
  transform:translateY(-50%);
}
.nav div{
  width:10px;height:10px;
  background:#fff;
  border-radius:50%;
  margin:10px 0;
  opacity:.4;
}
.nav .active{opacity:1;background:#d4af37}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.gallery img{
  width:100%;
  border-radius:12px;
}

form input,form textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
}
form button{width:100%}

audio{display:none}
</style>
</head>

<body>

<audio id="music" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- COVER -->
<section class="slide active">
  <div class="bg" style="background-image:url('img/photo1.jpg')"></div>
  <div>
    <h1>Roy & Trivena</h1>
    <p class="gold">June 26, 2026</p>
    <button onclick="next()">Open Invitation</button>
  </div>
</section>

<!-- COUPLE -->
<section class="slide">
  <div class="bg" style="background-image:url('img/photo2.jpg')"></div>
  <div>
    <h2>The Wedding of</h2>
    <h1 class="gold">Roy Alfredo Marselino Rengkung<br>&<br>Trivena Injili Rambing</h1>
  </div>
</section>

<!-- EVENT -->
<section class="slide">
  <div class="bg" style="background-image:url('img/photo3.jpg')"></div>
  <div>
    <h2>Holy Matrimony</h2>
    <p>Friday, June 26, 2026</p>
    <p>10.00 WITA</p>
    <br>
    <h2>Reception</h2>
    <p>16.00 WITA</p>
    <p>Aula Koronka</p>
    <br>
    <h3 id="countdown" class="gold"></h3>
    <br>
    <a href="https://wa.me/6281234567890" target="_blank">
      <button>RSVP via WhatsApp</button>
    </a>
  </div>
</section>

<!-- GALLERY -->
<section class="slide">
  <div class="bg" style="background-image:url('img/photo4.jpg')"></div>
  <div>
    <h2 class="gold">Our Gallery</h2>
    <div class="gallery">
      <img src="img/photo1.jpg">
      <img src="img/photo2.jpg">
      <img src="img/photo3.jpg">
      <img src="img/photo4.jpg">
      <img src="img/photo5.jpg">
      <img src="img/photo6.jpg">
      <img src="img/photo7.jpg">
      <img src="img/photo8.jpg">
    </div>
  </div>
</section>

<!-- WISHES -->
<section class="slide">
  <div class="bg" style="background-image:url('img/photo5.jpg')"></div>
  <div style="width:100%;max-width:400px">
    <h2 class="gold">Wishes & Prayers</h2>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <textarea name="message" rows="4" placeholder="Your Wishes" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</section>

<div class="nav">
  <div class="active"></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
</div>

<script>
let slides=document.querySelectorAll('.slide')
let dots=document.querySelectorAll('.nav div')
let index=0

function show(i){
  slides.forEach((s,n)=>{
    s.classList.remove('active')
    dots[n].classList.remove('active')
  })
  slides[i].classList.add('active')
  dots[i].classList.add('active')
}

function next(){
  if(index<slides.length-1){
    index++
    show(index)
  }
}

document.body.addEventListener('click',()=> {
  document.getElementById('music').play()
},{once:true})

const target=new Date("June 26, 2026 10:00:00").getTime()
setInterval(()=>{
  let now=new Date().getTime()
  let d=target-now
  let days=Math.floor(d/(1000*60*60*24))
  document.getElementById('countdown').innerHTML=
    days+" Days to Go"
},1000)
</script>

</body>
</html>
<script>
let startY = 0;

document.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
});

document.addEventListener('touchend', e => {
  let endY = e.changedTouches[0].clientY;
  if(startY - endY > 50){
    next();
  }
});
</script>
