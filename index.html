<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roy & Trivena Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background:#000;
}

section {
  position: absolute;
  width: 100%;
  height: 100vh;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  transition: transform .9s ease;
}

.bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(6px) brightness(.55);
  z-index: -1;
}

.gold { color: #d4af37; }

h1, h2 {
  font-family: 'Playfair Display', serif;
}

button {
  padding: 14px 30px;
  border-radius: 30px;
  border: none;
  background: #d4af37;
  font-weight: 600;
  cursor: pointer;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.gallery img {
  width: 100%;
  border-radius: 14px;
}

form input, form textarea {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin: 6px 0;
}

form button {
  width: 100%;
  margin-top: 10px;
}

.swipe {
  position: absolute;
  bottom: 25px;
  font-size: 12px;
  opacity: .8;
  animation: updown 1.6s infinite;
}

@keyframes updown {
  0% { transform: translateY(0); opacity:.4 }
  50% { transform: translateY(8px); opacity:1 }
  100% { transform: translateY(0); opacity:.4 }
}

audio { display:none; }
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<section>
  <div class="bg" style="background-image:url('img/photo1.jpg')"></div>
  <div>
    <h1>Roy & Trivena</h1>
    <p class="gold">June 26, 2026</p>
    <button onclick="openInvite()">Open Invitation</button>
    <div class="swipe">Swipe Up ↑</div>
  </div>
</section>

<section>
  <div class="bg" style="background-image:url('img/photo2.jpg')"></div>
  <div>
    <h2>The Wedding of</h2>
    <h1 class="gold">Roy Alfredo Marselino Rengkung<br>&<br>Trivena Injili Rambing</h1>
    <div class="swipe">Swipe Up ↑</div>
  </div>
</section>

<section>
  <div class="bg" style="background-image:url('img/photo3.jpg')"></div>
  <div>
    <h2>Holy Matrimony</h2>
    <p>Friday, June 26, 2026</p>
    <p>10.00 WITA</p>
    <br>
    <h2>Reception</h2>
    <p>16.00 WITA</p>
    <p>Aula Koronka</p>
    <br>
    <h3 id="countdown" class="gold"></h3>
    <br>
    <a href="https://wa.me/6281234567890">
      <button>RSVP via WhatsApp</button>
    </a>
    <div class="swipe">Swipe Up ↑</div>
  </div>
</section>

<section>
  <div class="bg" style="background-image:url('img/photo4.jpg')"></div>
  <div>
    <h2 class="gold">Our Gallery</h2>
    <div class="gallery">
      <img src="img/photo1.jpg">
      <img src="img/photo2.jpg">
      <img src="img/photo3.jpg">
      <img src="img/photo4.jpg">
      <img src="img/photo5.jpg">
      <img src="img/photo6.jpg">
      <img src="img/photo7.jpg">
      <img src="img/photo8.jpg">
    </div>
    <div class="swipe">Swipe Up ↑</div>
  </div>
</section>

<section>
  <div class="bg" style="background-image:url('img/photo5.jpg')"></div>
  <div style="width:90%;max-width:380px">
    <h2 class="gold">Wishes & Prayers</h2>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <textarea name="message" placeholder="Your Wishes" rows="4" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</section>

<script>
const slides = document.querySelectorAll("section");
let current = 0;

function showSlide(i){
  slides.forEach((s, idx) => {
    s.style.transform = `translateY(${(idx - i) * 100}vh)`;
  });
}

function openInvite(){
  document.getElementById("music").play();
  next();
}

function next(){
  if(current < slides.length - 1){
    current++;
    showSlide(current);
  }
}

let startY = 0;
document.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
  let endY = e.changedTouches[0].clientY;
  if(startY - endY > 50) next();
});

showSlide(0);

const target = new Date("June 26, 2026 10:00:00").getTime();
setInterval(() => {
  let now = new Date().getTime();
  let d = target - now;
  let days = Math.floor(d / (1000*60*60*24));
  document.getElementById("countdown").innerHTML =
    days + " Days to Go";
}, 1000);
</script>

</body>
</html>
